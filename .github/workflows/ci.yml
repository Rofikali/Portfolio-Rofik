name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: portfolio/.nvmrc
          cache: pnpm
          cache-dependency-path: portfolio/pnpm-lock.yaml

      - name: Check generated milestone documentation
        working-directory: .
        run: node scripts/docs-sync.mjs --check

      - name: Require manifest changes for implementation PRs
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$DOCS_BASE_SHA"
          node scripts/check-pr-docs.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      - name: Generate static site
        run: pnpm generate
        env:
          NUXT_APP_BASE_URL: /Portfolio-Rofik/
