name: SEC-001 Temporary Dependency Repair Candidate

on:
  push:
    branches:
      - security/sec-001-dependency-remediation

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: portfolio/.nvmrc
          cache: pnpm
          cache-dependency-path: portfolio/pnpm-lock.yaml
      - name: Record baseline audit
        run: pnpm audit --json > sec001-audit-before.json || true
      - name: Generate minimally invasive repair candidate
        run: pnpm audit --fix || true
      - name: Resolve updated lockfile
        run: pnpm install --no-frozen-lockfile --lockfile-only
      - name: Record repaired audit
        run: pnpm audit --json > sec001-audit-after.json || true
      - name: Verify frozen lockfile install
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Check types
        run: pnpm typecheck
      - name: Generate static Pages artifact
        env:
          NUXT_APP_BASE_URL: /Portfolio-Rofik/
        run: pnpm generate
      - name: Upload candidate lockfile, manifests and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec001-dependency-candidate
          retention-days: 3
          path: |
            portfolio/pnpm-lock.yaml
            portfolio/pnpm-workspace.yaml
            portfolio/package.json
            portfolio/sec001-audit-before.json
            portfolio/sec001-audit-after.json
