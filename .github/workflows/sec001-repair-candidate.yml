name: SEC-001 Temporary Dependency Refresh Candidate

on:
  push:
    branches:
      - security/sec-001-dependency-remediation

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: portfolio/.nvmrc
          cache: pnpm
          cache-dependency-path: portfolio/pnpm-lock.yaml
      - name: Record pre-update audit
        run: pnpm audit --json > sec001-audit-before.json || true
      - name: Update compatible dependencies within declared ranges
        run: pnpm update
      - name: Add explicit Nuxt type checker
        run: pnpm add -D vue-tsc@^3.1.0
      - name: Record post-update audit
        run: pnpm audit --json > sec001-audit-after.json || true
      - name: Verify frozen lockfile install
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Check types
        run: pnpm typecheck
      - name: Generate static Pages artifact
        env:
          NUXT_APP_BASE_URL: /Portfolio-Rofik/
        run: pnpm generate
      - name: Export generated manifest and lockfile as chunked text
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          for (const file of ['package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml']) {
            const content = fs.readFileSync(file, 'utf8')
            const parts = content.match(/[\s\S]{1,2800}/g) || []
            console.log('SEC001_BEGIN ' + file + ' ' + parts.length)
            parts.forEach((part, i) => console.log('SEC001_PART ' + file + ' ' + i + ' ' + JSON.stringify(part)))
            console.log('SEC001_END ' + file)
          }
          NODE
      - name: Upload candidate lockfile, manifests and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec001-dependency-candidate
          retention-days: 3
          path: |
            portfolio/pnpm-lock.yaml
            portfolio/pnpm-workspace.yaml
            portfolio/package.json
            portfolio/sec001-audit-before.json
            portfolio/sec001-audit-after.json
